<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Game Stop · 设备配对</title><script defer src="/device-connect.js"></script></head>
<body>
<main>
<h1>连接游戏设备</h1>
<p>游戏：<strong id="game-title">{{.Title}}</strong></p>
<p>设备码：<strong id="device-code">{{.Code}}</strong></p>
<p>请确认上述游戏及设备码与您正在使用的设备完全一致。不要批准他人发送的配对请求。</p>
<p>账号 Token 由管理员为您提供；本站不开放注册。每位玩家使用自己的账号，不能把发行者账号共享给所有人。</p>
<p>账号 Token 仅发送至当前 HTTPS 平台，不会交给游戏、不写入网址或浏览器存储。游戏只获得绑定该游戏的短期游玩凭据，可代表您提交成绩。</p>
<form id="device-form" autocomplete="off">
<label>您的账号 Token <input id="account-token" type="password" required autocomplete="off" spellcheck="false" maxlength="46"></label>
<p><label><input id="device-confirm" type="checkbox" required>我已核对游戏和设备码，同意此设备以我的身份游玩并提交成绩。</label></p>
<button id="authorize-button" type="submit">确认并授权设备</button>
</form>
<p id="device-status" role="status" aria-live="polite"></p>
<p>配对码五分钟后失效。若设备未收到授权结果，请重新发起配对；游玩凭据仅交付一次，不可重取。</p>
</main>
</body></html>
